<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MANDATORY FUN</title>

<style>
body {
  background: repeating-linear-gradient(
    45deg,
    #f5f1e6,
    #f5f1e6 20px,
    #e8e1d1 20px,
    #e8e1d1 40px
  );
  font-family: "Comic Sans MS", Arial, sans-serif;
  text-align: center;
  padding: 20px;
  overflow-x: hidden;
}

.card {
  background: white;
  max-width: 750px;
  margin: auto;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 10px 25px rgba(0,0,0,.3);
  position: relative;
}

h1 {
  color: #1f4aa8;
  animation: shake 0.4s infinite alternate;
}

@keyframes shake {
  from { transform: rotate(-1deg); }
  to { transform: rotate(1deg); }
}

button {
  background: #1f4aa8;
  color: white;
  border: none;
  padding: 14px 22px;
  margin: 10px;
  font-size: 18px;
  border-radius: 10px;
  cursor: pointer;
  position: relative;
  transition: all 0.2s;
}

button:hover {
  background: #163a84;
  transform: scale(1.1);
}

#noBtn {
  position: absolute;
}

img {
  width: 100%;
  max-width: 400px;
  border-radius: 10px;
  margin-top: 15px;
}

.hidden {
  display: none;
}

#dmLogo {
  width: 150px;
  position: absolute;
  top: -75px;
  left: 50%;
  transform: translateX(-50%);
  animation: floatLogo 3s infinite alternate;
  cursor: pointer;
}

@keyframes floatLogo {
  from { transform: translateX(-50%) translateY(0px) rotate(0deg); }
  to { transform: translateX(-50%) translateY(15px) rotate(15deg); }
}

.quote {
  font-style: italic;
  margin-top: 10px;
}
</style>
</head>

<body>
<div class="card">
  <!-- Dunder Mifflin Logo -->
  <img id="dmLogo" src="https://upload.wikimedia.org/wikipedia/en/thumb/3/34/Dunder_Mifflin_Logo.svg/1200px-Dunder_Mifflin_Logo.svg.png" alt="Dunder Mifflin Logo">

  <h1>🚨 MANDATORY FUN ALERT 🚨</h1>
  <p><strong>From:</strong> Johan Alvarez<br>
     <strong>Subject:</strong> LOVE (IMPORTANT)</p>

  <img src="IMG_1178.jpeg" alt="Fun Image">

  <p id="quote" class="quote"></p>

  <button onclick="playMichael()">▶️ Michael Speaks</button>

  <audio id="audio1" src="https://www.myinstants.com/media/sounds/thats-what-she-said.mp3"></audio>
  <audio id="audio2" src="https://www.myinstants.com/media/sounds/no-god-please-no.mp3"></audio>
  <audio id="audio3" src="you-couldn-t-handle-my-undivided-attention.mp3"></audio>

  <h2>Will you be my Valentine?</h2>

  <div style="position: relative; height: 80px;">
    <button id="yesBtn">✅ YES</button>
    <button id="noBtn">❌ NO</button>
  </div>

  <div id="yesSection" class="hidden">
    <h2>🎉 FACT: YOU CHOSE CORRECTLY 🎉</h2>
    <p>I love you more than pretzel day.</p>
    <img src="check.jpg" alt="Check">
  </div>

  <div id="noSection" class="hidden"></div>

  <!-- GIF container for NO button -->
  <div id="noGifContainer" class="hidden" style="margin-top: 20px;">
    <img id="noGif" src="chili.gif" alt="NO Reaction GIF" style="max-width: 400px; border-radius: 10px;">
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
// Michael Scott Quote
const quotes = ["Well, you always left me satisfied and smiling, so... – Jim Halpert"];
document.getElementById("quote").innerText = quotes[Math.floor(Math.random() * quotes.length)];

// Michael speaks button
function playMichael() {
  document.getElementById("audio1").play();
}

// NO button movement
let noMovingInterval = null;

function moveNo() {
  const btn = document.getElementById("noBtn");
  const card = document.querySelector(".card");

  const maxX = card.offsetWidth - btn.offsetWidth;
  const maxY = 60;

  btn.style.left = Math.random() * maxX + "px";
  btn.style.top = Math.random() * maxY + "px";
  btn.style.transform = `rotate(${Math.random() * 40 - 20}deg)`;
}

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const audioNo = document.getElementById("audio2");

// Start NO button movement and audio on hover
noBtn.addEventListener("mouseenter", () => {
  // Start moving
  if (!noMovingInterval) {
    noMovingInterval = setInterval(moveNo, 200);
    audioNo.loop = true; // loop indefinitely until YES clicked
    audioNo.play();
  }
});

const audioYes = document.getElementById(:audio3");

// YES button stops audio and movement
yesBtn.addEventListener("click", () => {
  document.getElementById("yesSection").classList.remove("hidden");
  document.getElementById("noSection").classList.add("hidden");
  document.getElementById("noGifContainer").classList.add("hidden");

  confetti({
    particleCount: 200,
    spread: 100,
    shapes: ['square'],
    colors: ['#ff0000','#0000ff','#ffff00']
  });

  // Stop NO button movement
  clearInterval(noMovingInterval);
  noMovingInterval = null;

  // Stop audio
  audioNo.pause();
  audioNo.currentTime = 0;
  audioYes.pause();
  audioYes.currentTime = 0;
  audioYes.play().catch(e => console.log("Audio could not play:", e));
  noClickedAlready = false;
});

// NO button click shows denied section and GIF
noBtn.addEventListener("click", () => {
  noClickedAlready = true;
  clearInterval(noMovingInterval);
  noMovingInterval = null;
  const noSection = document.getElementById("noSection");
  noSection.classList.remove("hidden");
  document.getElementById("yesSection").classList.add("hidden");

  const noMessages = [
    "Great, you made Kevin spill his famous chili!"
  ];

  const randomMessage = noMessages[Math.floor(Math.random() * noMessages.length)];
  noSection.innerHTML =  `<h2>${randomMessage}</h2>`;

 // const gifImg = document.getElementById("noGif");
  //gifImg.src = "chili.gif"; // file in the same folder
  document.getElementById("noGifContainer").classList.remove("hidden");
});

// Dunder Mifflin logo easter egg
document.getElementById("dmLogo").onclick = () => {
  confetti({ particleCount: 100, spread: 70 });
  alert("Dunder Mifflin loves you!");
};
</script>
</body>
</html>
